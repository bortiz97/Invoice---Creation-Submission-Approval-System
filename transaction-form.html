<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Creation, Submission, and Approval System</title>
</head>

<body>

  <header>
    <h1>Invoice Creation, Submission, and Approval System</h1>
  </header>

  <main>
    <section>

      <h2>Create Invoice</h2>

      <p>
        Enter the invoice information below to create and submit an invoice
        for review and approval.
      </p>

      <form>

        <fieldset>

          <legend>Invoice Details</legend>

          <label for="invoiceNumber">Invoice Number</label>
          <input
            type="text"
            id="invoiceNumber"
            name="invoiceNumber"
            required>

          <br><br>

          <label for="clientName">Client Name</label>
          <input
            type="text"
            id="clientName"
            name="clientName"
            required>

          <br><br>

          <label for="invoiceDate">Invoice Date</label>
          <input
            type="date"
            id="invoiceDate"
            name="invoiceDate"
            required>

          <br><br>

          <label for="amount">Invoice Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            required>

          <br><br>

          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            required></textarea>

          <br><br>

          <label for="invoiceStatus">Invoice Status</label>
          <select
            id="invoiceStatus"
            name="invoiceStatus"
            required>

            <option value="">Select a status</option>
            <option value="draft">Draft</option>
            <option value="submitted">Submitted for Review</option>

          </select>

        </fieldset>

        <br>

        <button type="submit">Submit Invoice</button>

      </form>

    </section>
  </main>

</body>

</html>
